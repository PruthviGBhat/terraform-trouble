name: 'Terraform Pipeline'

on:
  push:
    branches:
      - terraform-updated
  pull_request:

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # Set the working directory where our Terraform code lives
    defaults:
      run:
        working-directory: ./terraform-trouble

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform (Downloads providers, connects to state)
      - name: Terraform Init
        run: terraform init

      # 5. Check formatting (Optional but good practice)
      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      # 6. Generate a Plan
      - name: Terraform Plan
        run: terraform plan
        
      # 7. Apply the changes automatically (ONLY if this is a push to the main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
